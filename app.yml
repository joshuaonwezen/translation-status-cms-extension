meta:
  app_id: cms_translation_status
  display_name: Translation status
  version: 0.0.1-dev.0
  vendor: optimizely
  summary: See which languages a page is in, which fields are still untranslated, and how far each language covers the site.
  support_url: https://www.optimizely.com
  contact_email: joshua.onwezen@optimizely.com
  categories:
    - Testing & Utilities
  availability:
    - all

runtime: node22-cms-ext

functions:
  cms_extension:
    entry_point: CmsUiExtension
    description: Compares an item's language versions (CMS REST) and counts published pages per language (Graph).
    accepts: cms_ui_extension

ui_extensions:
  sidebar:
    - name: translation-status
      entry_point: TranslationStatus
      display_name: Translations
  view:
    - name: translation-coverage
      entry_point: TranslationCoverage
      display_name: Translations
