sections:
  - key: graph
    label: Optimizely Graph
    elements:
      - type: secret
        key: singleKey
        label: Single key
        help: >-
          Found in the CMS under Settings > API Keys. The Translations view needs it to count the
          published pages in each language. The sidebar works without it, but then lists only the
          languages an item is already in. Leave blank to keep the saved key.
      - type: button
        label: Save
        action: saveGraph
        style: primary
  - key: cms
    label: CMS API client
    elements:
      - type: text
        key: clientId
        label: Client ID
        help: >-
          Needed for the sidebar. Create an API client in the CMS under Settings > API Keys. Read
          access is enough: the sidebar reads each language version of the open item, drafts
          included, and the content types that say which fields are translatable.
      - type: secret
        key: clientSecret
        label: Client secret
        help: Shown once, when the API client is created. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveCms
        style: primary
